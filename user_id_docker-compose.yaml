# Compose v2 ignores "version:", so omit it.

x-common-env: &common_env
  env_file:
    - .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    HOME: /tmp
    NPM_CONFIG_CACHE: /tmp/.npm

x-common-mounts: &common_mounts
  working_dir: /workspace
  volumes:
    # mount your app repo into a writable path
    - ./:/workspace
    # mount your host cache into container's node_modules
    - /home/mattteixeira/app/cache_node_mod:/workspace/node_modules

services:
  # pure Node (no extra apt tools)
  app:
    image: node:lts
    <<: [*common_env, *common_mounts]
    user: "${UID:-1000}:${GID:-1000}"

  # Node + lftp/rsync from Dockerfile.runtime
  app_tools:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    <<: [*common_env, *common_mounts]
    user: "${UID:-1000}:${GID:-1000}"

version: "3.9"
services:
  app:
    image: node:lts
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app:rw
    command: bash -lc "npm ci && npm run start"
    env_file:
      - .env
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway" # <- makes the name resolve on Linux

x-common-env:
  &common_env # Load environment variables from .env in the project root
  env_file:
    - .env

  # Allow containers to reach services on the host via this hostname
  extra_hosts:
    - "host.docker.internal:host-gateway"

  # Runtime env vars
  environment:
    # Don't write into root's $HOME inside the image; use a tmp home
    HOME: /tmp

    # Keep npm's cache ephemeral (avoids permission issues on bind mounts)
    NPM_CONFIG_CACHE: /tmp/.npm

x-common-mounts: &common_mounts
  working_dir: /workspace
  volumes:
    # --- Bind mounts (host paths must exist) ---

    # 1) Project source → live edit on host reflects in container
    - ./:/workspace

    # 2) node_modules cache
    - ${NODE_MOD_CACHE_DEV}:/workspace/node_modules

    # 3) Centralized run logs
    - ${RUN_LOGS_DIR}

    # 4) ACQ files: host path -> container /workspace/files
    - ${DATA_STORE_DEV}:/workspace/files

# ---------- Services ----------
services:
  # DEPRECATED — use app_tools. Kept only for the cache-warm snippets in older
  # docs (doc 2.1); build.sh replaces that role. Runs as root with no entrypoint
  # repair, so avoid it: it drops root-owned files into the tree.
  app:
    # Base Node image (moves with LTS). For reproducibility, consider pinning:
    # image: node:22-bookworm (10/30/25)
    image: node:lts

    # Merge in common env + mounts
    <<: [*common_env, *common_mounts]
    networks:
      - redis_net # <-- attach to the external Redis network
    environment:
      # Prefer hostname over container IP
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: "${REDIS_PORT}"

  # Tooling container: built from docker/Dockerfile (baked-in gosu entrypoint)
  app_tools:
    # USER_ID drives the tag: data-acqu:<username> for dev builds, data-acqu:svc
    # for the release copy (flipped by #RELEASE:USER_ID=svc at release time).
    image: data-acqu:${USER_ID}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USER_ID: ${USER_ID}
        DOCKER_GID: ${DOCKER_GID}
        UID_0: ${UID_0}
        UID_1: ${UID_1}
        UID_2: ${UID_2}
    <<: *common_env
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ${NODE_MOD_CACHE_DEV}:/workspace/node_modules
      - ${RUN_LOGS_DIR}
      - ${DATA_STORE_DEV}:/workspace/files
      # Shared SSH bundle (read-only). Entrypoint is now baked into the image,
      # so we no longer mount the full /opt/resources tree.
      - /opt/resources/ssh:/opt/resources/ssh:ro
    environment:
      RUN_USER: ${RUN_USER}
      NPM_CONFIG_CACHE: /tmp/.npm
      SSH_KEY: ${SSH_KEY}
    networks:
      - redis_net
      - pg_net

# Declare the external network from the Redis compose project
networks:
  redis_net:
    external: true
    name: redis-admin_redis_net
  pg_net:
    external: true
